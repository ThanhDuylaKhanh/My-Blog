<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duy Khánh Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              accent: "#6366F1",
              "accent-dark": "#4F46E5",
              beige: "#F5F5DC",
              "beige-dark": "#E6E6CD",
            },
            fontFamily: {
              inter: ["Inter", "sans-serif"],
              lora: ["Lora", "serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .line-clamp-3 {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* Rich text editor styles */
      #blogContentEditor {
        min-height: 300px;
        max-height: 500px;
        overflow-y: auto;
      }

      #blogContentEditor:empty:before {
        content: "Viết nội dung bài blog của bạn...";
        color: #9ca3af;
        font-style: italic;
      }

      /* Ensure proper styling for editor content */
      #blogContentEditor h1,
      #blogContentEditor h2,
      #blogContentEditor h3,
      #blogContentEditor h4,
      #blogContentEditor h5 {
        font-weight: 800;
        margin: 1.5rem 0;
      }

      #blogContentEditor h1 {
        font-size: 2rem;
      }
      #blogContentEditor h2 {
        font-size: 1.75rem;
      }
      #blogContentEditor h3 {
        font-size: 1.5rem;
      }
      #blogContentEditor h4 {
        font-size: 1.375rem;
      }

      #blogContentEditor h5 {
        font-size: 1.25rem;
      }

      #blogContentEditor blockquote {
        border-left: 4px solid #6366f1;
        padding-left: 1rem;
        font-style: italic;
        margin: 1rem 0;
        background-color: rgba(99, 102, 241, 0.05);
        padding: 1rem;
        border-radius: 0 0.5rem 0.5rem 0;
      }

      #blogContentEditor a {
        color: #6366f1;
        text-decoration: underline;
      }

      #blogContentEditor a:hover {
        color: #4f46e5;
      }

      #blogContentEditor img {
        max-width: 100%;
        height: auto;
        border-radius: 0.5rem;
        margin: 1rem auto;
        display: block;
      }

      /* Styling for blog content display */
      .blog-content-styling h1 {
        font-size: 2rem;
        font-weight: 800;
        margin: 1.5rem 0;
        line-height: 1.2;
      }

      .blog-content-styling h2 {
        font-size: 1.75rem;
        font-weight: 800;
        margin: 1.5rem 0;
        line-height: 1.3;
      }

      .blog-content-styling h3 {
        font-size: 1.5rem;
        font-weight: 800;
        margin: 1.5rem 0;
        line-height: 1.3;
      }

      .blog-content-styling h4 {
        font-size: 1.375rem;
        font-weight: 800;
        margin: 1.5rem 0;
        line-height: 1.4;
      }

      .blog-content-styling h5 {
        font-size: 1.25rem;
        font-weight: 800;
        margin: 1.5rem 0;
        line-height: 1.4;
      }
    </style>
  </head>
  <body
    class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300"
    id="body"
  >
    <!-- Header -->
    <header
      class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-50 shadow-sm"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <!-- Logo -->
          <div class="flex items-center">
            <h1
              class="text-xl font-bold text-gray-900 dark:text-white cursor-pointer"
              onclick="showHome()"
            >
              Duy Khánh Blog
            </h1>
          </div>

          <!-- Center - Search Bar -->
          <div class="hidden md:flex flex-1 max-w-md mx-8">
            <div class="relative w-full">
              <input
                type="text"
                id="searchInput"
                placeholder="Tìm kiếm bài viết..."
                class="w-full px-4 py-2 pl-10 pr-4 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-accent focus:border-transparent"
              />
              <i
                class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"
              ></i>
              <div
                id="searchResults"
                class="absolute top-full left-0 right-0 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg mt-1 shadow-lg hidden max-h-60 overflow-y-auto z-50"
              ></div>
            </div>
          </div>

          <!-- Right Controls -->
          <div class="flex items-center space-x-4">
            <!-- Font Selector -->
            <div class="relative">
              <select
                id="fontSelector"
                class="text-sm bg-transparent border border-gray-300 dark:border-gray-600 rounded px-2 py-1 text-gray-700 dark:text-gray-300"
              >
                <option value="inter">Inter</option>
                <option value="lora">Lora</option>
                <option value="mono">Mono</option>
              </select>
            </div>

            <!-- Dark/Light Toggle -->
            <button
              id="themeToggle"
              class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
            >
              <i class="fas fa-moon text-gray-600 dark:text-gray-300"></i>
            </button>

            <!-- About Button -->
            <button
              onclick="showAbout()"
              class="text-sm bg-accent text-white px-4 py-2 rounded-lg hover:bg-accent-dark transition-colors"
            >
              Giới thiệu
            </button>

            <!-- Social Links -->
            <div
              id="headerSocialLinks"
              class="hidden lg:flex items-center space-x-3"
            >
              <!-- Social links will be rendered here -->
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <!-- Home Page -->
      <div id="homePage" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Blog List -->
        <div class="lg:col-span-2">
          <h2 class="text-2xl font-bold mb-6">Bài viết mới nhất</h2>
          <div id="blogList" class="space-y-6">
            <!-- Blog posts will be rendered here -->
          </div>

          <!-- Pagination -->
          <div id="pagination" class="flex justify-center mt-8 space-x-2">
            <!-- Pagination buttons will be rendered here -->
          </div>
        </div>

        <!-- Sidebar -->
        <div class="lg:col-span-1">
          <div class="bg-gray-50 dark:bg-gray-800 rounded-lg p-6 sticky top-24">
            <!-- About Me -->
            <div class="text-center mb-6">
              <img
                id="profileImg"
                src="https://lh3.googleusercontent.com/a/ACg8ocKHaDxR29_7lvDcQjEAgPbhW81ByFqa1jk31hVldh38Ev0p_Vhe=s360-c-no"
                alt="Profile"
                class="w-36 h-36 rounded-lg mx-auto mb-4 shadow-lg"
              />
              <h3 id="profileName" class="text-xl font-semibold mb-2">
                Duy Khánh
              </h3>
              <p
                id="profileBio"
                class="text-gray-600 dark:text-gray-400 text-sm leading-relaxed mb-4"
              >
                Hello! Mình là Duy Khánh, Một cậu học trò nhỏ có niềm đam mê với
                Khoa học. Đây là nơi mình chia sẻ những sở thích cá nhân và
                những thứ khác trong cuộc sống
              </p>

              <!-- Social Links -->
              <div
                id="sidebarSocialLinks"
                class="flex justify-center space-x-4 mb-4"
              >
                <!-- Social links will be rendered here -->
              </div>

              <!-- Action Buttons -->
              <div class="space-y-3">
                <button
                  onclick="showRandomBlog()"
                  class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white px-4 py-2 rounded-lg hover:from-purple-600 hover:to-pink-600 transition-all duration-300 text-sm font-medium shadow-md hover:shadow-lg transform hover:scale-105"
                >
                  <i class="fas fa-random mr-2"></i>Bài ngẫu nhiên
                </button>
                <button
                  onclick="showAbout()"
                  class="w-full bg-accent text-white px-4 py-2 rounded-lg hover:bg-accent-dark transition-colors text-sm"
                >
                  <i class="fas fa-user mr-2"></i>Xem thêm
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Blog Detail Page -->
      <div id="blogDetailPage" class="hidden max-w-4xl mx-auto">
        <article
          id="blogContent"
          class="prose prose-lg dark:prose-invert max-w-none"
        >
          <!-- Blog content will be rendered here -->
        </article>

        <!-- Random Blog Button -->
        <div
          class="text-center mt-8 pt-6 border-t border-gray-200 dark:border-gray-700"
        >
          <button
            onclick="showRandomBlog()"
            class="bg-gradient-to-r from-purple-500 to-pink-500 text-white px-6 py-3 rounded-lg hover:from-purple-600 hover:to-pink-600 transition-all duration-300 font-medium shadow-md hover:shadow-lg transform hover:scale-105"
          >
            <i class="fas fa-random mr-2"></i>Khám phá bài ngẫu nhiên
          </button>
        </div>

        <!-- Navigation -->
        <div
          class="flex justify-between items-center mt-8 pt-8 border-t border-gray-200 dark:border-gray-700"
        >
          <button
            id="prevBlog"
            class="flex items-center text-accent hover:text-accent-dark disabled:text-gray-400 disabled:cursor-not-allowed"
          >
            <i class="fas fa-chevron-left mr-2"></i>Bài trước
          </button>
          <button
            onclick="showHome()"
            class="text-gray-600 dark:text-gray-400 hover:text-accent"
          >
            <i class="fas fa-home mr-2"></i>Trang chủ
          </button>
          <button
            id="nextBlog"
            class="flex items-center text-accent hover:text-accent-dark disabled:text-gray-400 disabled:cursor-not-allowed"
          >
            Bài sau<i class="fas fa-chevron-right ml-2"></i>
          </button>
        </div>

        <!-- Comments Section -->
        <div class="mt-12 pt-8 border-t border-gray-200 dark:border-gray-700">
          <h3 class="text-xl font-semibold mb-6">Bình luận</h3>

          <!-- Comment Form -->
          <form id="commentForm" class="mb-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
              <input
                type="text"
                id="commentName"
                placeholder="Tên của bạn"
                required
                class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 focus:ring-2 focus:ring-accent focus:border-transparent"
              />
              <input
                type="email"
                id="commentEmail"
                placeholder="Email (không hiển thị)"
                required
                class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 focus:ring-2 focus:ring-accent focus:border-transparent"
              />
            </div>
            <textarea
              id="commentContent"
              rows="4"
              placeholder="Viết bình luận của bạn..."
              required
              class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 focus:ring-2 focus:ring-accent focus:border-transparent mb-4"
            ></textarea>
            <button
              type="submit"
              class="bg-accent text-white px-6 py-2 rounded-lg hover:bg-accent-dark transition-colors"
            >
              <i class="fas fa-paper-plane mr-2"></i>Gửi bình luận
            </button>
          </form>

          <!-- Comments List -->
          <div id="commentsList" class="space-y-6">
            <!-- Comments will be rendered here -->
          </div>
        </div>
      </div>

      <!-- About Me Page -->
      <div id="aboutPage" class="hidden max-w-4xl mx-auto">
        <div class="text-center mb-8">
          <img
            id="aboutProfileImg"
            src=""
            alt="Profile"
            class="w-40 h-40 rounded-lg mx-auto mb-6 shadow-lg"
          />
          <h1 id="aboutProfileName" class="text-3xl font-bold mb-4"></h1>
          <p
            id="aboutProfileBio"
            class="text-lg text-gray-600 dark:text-gray-400 leading-relaxed max-w-2xl mx-auto"
          ></p>
        </div>

        <!-- Social Links -->
        <div
          id="aboutSocialLinks"
          class="flex justify-center flex-wrap gap-4 mb-8"
        >
          <!-- Social links will be rendered here -->
        </div>
      </div>
    </main>

    <script>
      // ===== BIẾN TOÀN CỤC - Lưu trạng thái của website =====
      let currentBlogId = null; // ID của blog đang xem (null = đang ở trang chủ)
      let currentPage = 1; // Trang hiện tại trong phân trang
      const blogsPerPage = 5; // Số blog hiển thị mỗi trang

      // ===== CÁC HÀM TẠO BLOG - Mỗi blog một hàm riêng để dễ quản lý =====
      // Muốn xóa blog nào thì xóa hàm đó và bỏ khỏi mảng blogs ở dưới

      // BLOG 1: Bài viết về học lập trình
      function getBlog1() {
        return {
          id: 1, // ID blog thứ 1
          title: "Hành trình học lập trình từ con số 0",
          description:
            "Mặc dù là một học sinh chuyên tin ở thời điểm hiện tại, dù vậy trong quá khứ mình   đã từng vật lộn chỉ để fix vài cái bug nhỏ, đến những cấu trúc tưởng đơn giản nhưng mà không xong, khoảng thời gian đó.",
          content: `<h1>Hành Trình Học Lập Trình Từ Con Số 0</h1>
                          <p> Mặc dù là một học sinh chuyên Tin ở thời điểm hiện tại, nhưng cách đây khoảng 5 năm mình đã từng rất vật lộn để tự nghĩ, tự giải các bài toán của lập trình. Thật sự lúc đó, với mình, mỗi lần code là một cực hình, bởi vì kỹ năng còn kém, mình đọc code còn chưa hiểu nó làm gì, chứ đừng nói là có thể làm lại theo. Dẫu vậy, mình đã kiên trì theo đuổi nó. Đến khi nhìn lại toàn bộ cuộc hành trình, mình thầm biết ơn bản thân với những ước mơ chưa từng dập tắt đó.</p>

                          <h2>1.Cơ Duyên Với Việc Học Lập Trình</h2>
                          <p> Vào khoảng thời gian chuyển cấp giữa cấp 1 và cấp 2, lúc đó dù tâm hồn khá ngây thơ nhưng lại thích quan sát thế giới, mình nghĩ ra vô số câu hỏi trong đầu mà đại loại như:</p>
                          <ul>
                          <li>“Chơi game như này, thì người ta làm ra game cho mình chơi kiểu gì nhỉ?”</li>
                          <li>Thậm chí còn vô tri hơn: “Có bố mẹ của game đẻ ra game không ta? Không đúng, mình được học ở cấp một là có một số vật chất không có khả năng sinh sản mà.”</li>
                          </ul>
                          <p> Sự tò mò ấy đã thôi thúc mình đi tìm câu trả lời trên mạng, và tất cả chúng đều dẫn đến một điểm chung duy nhất: <strong>Tin học và Lập trình</strong>.</p>
                          <p>(Bật mí cho các bạn là mình biết dùng máy tính từ năm 5 tuổi đó nha)</p>
                          <p> Thật ra thì mảng công nghệ vốn rất rộng, nhưng dù vậy, mình cũng chỉ biết đến lập trình mà thôi. Mình tò mò và bắt đầu học lập trình trên mạng, mình bắt đầu với những từ khóa như: <em>“Lập trình cơ bản cho người mới bắt đầu”</em>. Mình học theo các video dạng tương tự, và từ đó <strong>hành trình theo đuổi lập trình bắt đầu</strong>.</p>

                          <h2>2. Thời Điểm Bắt Đầu</h2>
                          <p> Mình không hề biết gì về cách hoạt động của các máy tính như CPU, GPU, RAM và bộ nhớ. Mình chỉ biết là máy tính hiểu mã nhị phân, và ngôn ngữ lập trình sẽ dịch chúng thành 0 và 1 để máy đọc và hiểu. Mình chỉ biết vậy thôi.</p>
                          <p> Lúc đó thì mình rất miệt mài học theo các video cơ bản, và rồi mình dừng lại, không học nữa.</p>
                          <p> Học vấn của mình lúc mới lên cấp 2 dù khá ấn tượng nhưng thành tích thì không tốt một chút nào. Mình đã có không ít lần bị mời phụ huynh trực tiếp lên, và điểm số thì cũng tỉ lệ nghịch với số lần bị gọi đó.</p>
                          <p> Mình học rất tệ. Bố mẹ của mình dù luôn thông cảm và nói với mình rằng: <em>“Không sao con ạ, con đã làm tốt rồi.”</em></p>
                          <p> Dẫu không nói, mình vẫn biết rằng thành tích của mình rất đáng lo ngại, nếu không muốn nói là có nguy cơ <strong>“trượt lớp chọn”</strong>.</p>
                          <p> Mình từ bỏ một số thói quen ngoài việc học, thay vào đó thì mình tập trung học theo châm ngôn:</p>
                          <blockquote>“Hiểu rồi thì làm, làm sai thì sửa, đúng thì học tiếp, chưa đúng thì học lại.”</blockquote>
                          <p> Mình đã học tốt lên một chút. GPA của mình được kéo từ <strong>7.3</strong> lên <strong>8.3</strong>. Dù không phải là quá giỏi nhưng nó có thể gọi là có tiến bộ.</p>

                          <h2>3. Một Vài Bước Ngoặt Trong Cuộc Đời</h2>
                          <p> Lên lớp 8, mình được học về lập trình Pascal, và mình nói thật, ngôn ngữ này rất ức chế người dùng vì nó quá chặt, khiến mọi logic và ý tưởng trở nên khó tưởng tượng hơn rất nhiều. Mặc dù vậy, với lượng kinh nghiệm có sẵn từ trước, mình nhanh chóng hoàn thành nó khá dễ dàng, và có lẽ vì thế, trong năm đó điểm GPA Tin của mình cũng đạt tuyệt đối <strong>10/10</strong>. Đây cũng là năm cuối mình học Tin chính thức trong trường.</p>
                          <p> Gần cuối năm lớp 8, kỳ thi <strong>Tin Học Trẻ cấp tỉnh</strong> được tổ chức tại tỉnh mình. Lúc đó thì 3 bạn giỏi nhất lớp được cô lựa chọn tham gia kỳ thi. Khá đáng tiếc, mình chỉ là một người bình thường nên cô không ngó ngàng tới.</p>
                          <p> Bạn đứng thứ 3 có vẻ khá tự ti về bản thân khi mà… bạn ấy không thể lập trình được như mình. Mình khá khó hiểu và có phần không muốn hiểu, rõ ràng là bạn ấy học không đến nỗi nào cơ mà.</p>
                          <p> Trong năm đó thì bộ phim <em>Chiếc Bật Lửa Và Váy Công Chúa</em> được phát sóng. Và có vẻ Thủ Khoa Lý Tuân – một nhân vật trong phim – rất được một số bạn nữ trong lớp mình ưa thích. Có tình tiết anh ta lập trình nên trái tim, lãng mạn thật. Mình cũng ước được làm nữ chính luôn ^^.</p>

                          <p> Được rồi, một bạn nữ trong lớp có hỏi mình có thể làm được trái tim giống anh Thủ Khoa Lý Tuân không. Thật ra thì nếu bảo làm như thủ khoa mà không có code thì hơi khoai đấy. May mắn là code có sẵn, mình chỉ việc clone về máy và rồi chỉnh sửa sao cho phù hợp thôi.</p>
                          <p> Nhờ lúc đó, thì cái bạn hạng 3 lớp có đến tâm sự và nhờ mình chỉ dạy. Mặc dù mình dạy khá đơn giản, nhưng mà… có vẻ bạn ấy bỏ cuộc rồi.</p>
                          <p> Vài hôm sau thì bạn ấy có nói rằng sẽ nhường mình đi. Mình thẳng thắn từ chối vì rõ ràng, nếu nhận thì không khác nào vứt bỏ danh dự; còn bạn ấy thì như vứt bỏ cơ hội.</p>
                          <p> Vài hôm sau nữa thì giáo viên Tin có bảo rằng để mình lên thay, và câu nói của cô rất đơn giản:</p>
                          <blockquote>“Bạn ấy giỏi thật, nhưng chưa đủ khả năng để làm những bài toán ấy, em đi thay nhé!”</blockquote>
                          <p> Mặc dù không tin nhưng mình cũng chẳng còn lựa chọn nào, vì nếu không đạt tối thiểu 3 người đi thì Sở sẽ không cho đoàn huyện của mình tham gia.</p>

                          <h2>4. Cuộc Thi Đầu Tiên Trong Đời</h2>
                          <p>Kỳ Thi Tin Học Trẻ được tổ chức bởi 4 bên gồm Trung ương Đoàn TNCS Hồ Chí Minh, Bộ Khoa học và Công nghệ, Bộ Giáo dục và Đào tạo và Hội Tin học Việt Nam.</p>
                          <p>Mặc dù không ổn áp cho lắm, khi lúc đó mình khá liều lĩnh khi dùng 2 ngôn ngữ khá lâu đời và gần với mã máy là <strong>C/C++</strong> và <strong>Pascal</strong>. Thật ra mình định dùng <em>Assembly</em> để code, tại vì nó ngầu, cơ mà một câu lệnh đơn giản cũng tốn của mình gấp 10 lần chứ đừng nói đến một chương trình hoàn chỉnh. Vậy nếu nó là chương trình hoàn chỉnh thì chắc chắn là mình không có thời gian để nghĩ nữa.</p>
                          <p>Đề thi được lấy từ “Trung tâm nghiên cứu và phát triển tiềm năng của con người”. Mặc dù chỉ là kiến thức cấp 2, nhưng đã nhẹ nhàng nhét tổng xích ma vào trong đó. Thật ra thì chả có gì khó, mà tại đầu mình chưa “nảy số” được các tình huống đó. Thế nên mình thấy nó khó. Nếu bây giờ mình làm lại, thì bài đó mình hoàn toàn có thể dễ dàng làm tốt, mà chẳng còn chật vật như trước.</p>
                          <p>Lúc đó thì giáo viên môn Tin của mình đã nói: <blockquote>“Đây chỉ là lần đầu trải nghiệm, mình có giải thì tốt, mà không có thì chẳng sao cả.”</blockquote></p>
                          <p>Vâng! Thật vui thì 3 đứa đi thi, 2 đứa có giải, tôi trắng tay. Nghe đớn không chứ! May mắn là khối THPT cũng trắng tay, nên mình bớt tủi thân hơn một chút.</p>
                          <p>Mình mặc dù biết đây chỉ là kỳ thi đầu tiên, nhưng khởi đầu như này thì khó khăn thật, cảm giác như mình không phù hợp với việc lập trình vậy.</p>

                          <h2>5. Nguồn Động Lực Và Cách Mình Học</h2>
                          <p>Như mình đã nói, mình được truyền cảm hứng bằng việc tự khám phá. Đương nhiên mình không có tư duy “nghiện game nên học lập trình” đâu nha, ngược lại mình còn chơi game rất tệ nữa.</p>
                          <p>Nhiều bạn sẽ nghĩ, để vào được chuyên Tin thôi thì cái động lực của mình thật vớ vẩn. Nhưng tuy nhiên các bạn phải hiểu rằng, động lực chẳng khác gì cảm xúc, nó đến rồi sẽ đi, chứ không ở lại mãi mãi. Thật ra thì đừng nói hay nghĩ gì nhiều, bạn học là vì bạn chứ chẳng vì ai đâu, cho nên đừng suy nghĩ lâu xa về động lực. Đương nhiên mình cũng có động lực, và động lực của mình rất đơn giản: mình muốn trở thành một <strong>Developer</strong>, và mình luôn kiên định với điều đó.</p>
                          <p>Nói thêm một chút, động lực nó giống như một đôi giày tốt hoặc một thứ gì đó khi bạn sở hữu, bạn sẽ rất thích thú và muốn tận dụng thật tốt. Nhưng rồi đến một lúc nào đó bạn sẽ tự quên đi mục đích ban đầu của chính mình. Và rồi bạn sẽ tự hỏi lại chính mình rằng: <em>“Nó để làm gì vậy?”</em></p>
                          <p>Có rất nhiều người nói rằng, hãy xây dựng một routine học phù hợp với bản thân, và nên duy trì việc học mệt mỏi nhiều ngày và học vài tiếng mỗi ngày. Nhưng với mình nó rất… dễ nản. Mình chẳng hiểu sao mọi người lại phải xây dựng một cái routine dễ nản và dễ cạn năng lượng như thế, trong khi đó rõ ràng nếu bắt đầu thì bạn nên nhẹ nhàng, chứ không phải ôm 4, 5, 6 chục cái đề để rồi than trách “sao học lập trình khó quá”. <strong>Nghe nè:</strong> bạn có thể làm tất cả, chỉ là không phải cùng lúc thôi.</p>
                          <p>Mình có động lực nhưng không quá lớn lao hay vĩ mô gì cả. Mình chỉ suy nghĩ: <em>“À, mình là người bình thường. Người bình thường thì làm gì cũng được, chỉ là không phải quá xuất sắc như các thiên tài thôi.”</em></p>
                          <p>Mang theo suy nghĩ đó, mình luôn học với tâm thế: <blockquote>“Chẳng có việc gì khó, chỉ sợ lòng không bền .”</blockquote> Đương nhiên các bạn không cần phải dành 6, 8, 10, 12 tiếng một ngày chỉ để cày đề HSG hay làm các API làm gì cả. Các bạn chỉ cần học sao các bạn thấy phù hợp là được.</p>
                          <p>Cách học của mình rất đơn giản: mình học như người bình thường, 6-7 giờ sáng thì dậy, 11 giờ thì đi ngủ.</p>
                          <p>Mình biết thừa rằng dù có thông minh đến đâu mà cứ ỷ lại cái sự thông minh, ưu tú đó của bản thân thì sớm hay muộn gì càng lên cao bạn sẽ thất bại dễ dàng hơn mà thôi. Hãy tưởng tượng xung quanh ai cũng như bạn, ai cũng thông minh như bạn, và ai cũng ỷ lại cái sự thông minh đó như bạn. Vậy bạn còn là người nổi trội không? Rõ ràng là không. Vậy nếu bạn chăm chỉ hơn, thì bạn rõ ràng có lợi thế hơn họ.</p>
                          <p><strong>Chú ý nè:</strong> đừng có dụ bạn kiểu “Tao cũng không học gì đâu, nên 2 đứa học lại”. Người nói câu này thì không đáng tin, mà người tin câu này thì quá khờ khạo.</p>
                          <p>Hãy học sao cho không cần ai biết bạn học, không cần ai thấy bạn học, mà bạn vẫn giỏi thì đấy mới đáng. Chứ đừng gây dựng hình tượng chăm chỉ rồi điểm số khó tả. Vậy nên <strong>“cần cù bù thông minh”</strong> luôn đúng, chỉ là đúng.</p>
                          <p>Hãy đặt các mục tiêu nhỏ mà bạn dễ dàng để hoàn thành. Cái này được gọi là <em>thói quen nhỏ (Mini Habits)</em>. Các bạn có thể tìm ở trên mạng hoặc đọc ở Blog của mình trong tương lai.</p>

      <p>Mình luôn muốn đi thật xa, trải nghiệm nhiều nền văn hóa, học hỏi thật nhiều. Người ta thường nói: <em>“Đi đi em! Do dự trời tối mất.”</em> Nhưng xin lỗi, mình không phải do dự… mình chỉ thiếu tiền. Nếu có đủ, mình sẵn sàng đi muôn nơi để mở mang tầm mắt, để đổi mới tư duy, để tiến bộ hơn.</p>

      <p><strong>Hiểu bản thân</strong> — có thể đó là một thành tựu, cũng có thể chỉ đơn giản là một phần tất yếu trong hành trình trưởng thành. Và có lẽ, đôi chân mình vẫn đang đi trên con đường đó: không bến đỗ, không điểm dừng. Đi mãi sẽ mệt thôi, nhưng dù chỉ là những bước nhỏ, mình vẫn đang bước.</p>

      <p>Mình chỉ đơn giản nhìn nhận lại và công nhận rằng <strong>mình có ưu điểm</strong>. Đơn giản vậy thôi!</p>

      <h2>Mình không còn nhiều thời gian nữa</h2>

      <p>Dù mới chỉ học lớp 11, nhưng mình nhận ra quỹ thời gian của bản thân không còn nhiều như tưởng tượng. Khi đi phỏng vấn, rất nhiều CLB đều hỏi: <em>“Bạn có thể dành bao nhiêu thời gian cho CLB?”</em> — một câu hỏi mà mình khó trả lời thẳng thắn.</p>

      <p>Mỗi năm, mình tham gia tới 4 CLB, 3 kỳ thi cấp tỉnh và cấp quốc gia. Thêm vào đó là công việc của một thành viên Ban Chủ Nhiệm. Chỉ từng đó thôi cũng đủ để lấp kín lịch trình. Nhưng lạ ở chỗ, mình vẫn luôn có những khoảng thời gian rảnh rỗi cực kỳ nhiều. Có lẽ là nhờ khả năng quản lý thời gian của bản thân.</p>

      <p>Tuy nhiên, việc ôm đồm quá nhiều hoạt động và vai trò lại khiến mình trở nên <em>“kém ưu tiên”</em> hơn trong mắt các CLB. Bởi họ e ngại rằng mình sẽ không thể toàn tâm toàn ý.</p>

      <p>Thực ra, số mục tiêu mình đặt ra trong năm nay không khác mấy so với những năm trước, chỉ thêm việc tham gia các CLB. Nhưng điều khiến mình thực sự bận rộn chính là các kỳ thi mang tính tuyển sinh đại học.</p>

      <p><strong>Quản lý thời gian</strong> với mình giống như một nghệ thuật. Mình đã luyện tập để có thể tìm thấy khoảng rảnh, dù lịch trình có dày đặc đến đâu. Thế nhưng, mình vẫn cảm nhận rõ rằng: thời gian đang dần đếm ngược, và mình không còn nhiều nữa.</p>

      // ===== QUẢN LÝ GIAO DIỆN SÁNG/TỐI =====
      // Khởi tạo theme từ bộ nhớ trình duyệt
      function initTheme() {
        const savedTheme = localStorage.getItem("theme") || "light";
        if (savedTheme === "dark") {
          document.documentElement.classList.add("dark");
          document.getElementById("themeToggle").innerHTML =
            '<i class="fas fa-sun text-gray-600 dark:text-gray-300"></i>';
        }
      }

      // Chuyển đổi giữa giao diện sáng và tối
      function toggleTheme() {
        const html = document.documentElement; // Lấy thẻ <html>
        const themeToggle = document.getElementById("themeToggle"); // Nút chuyển đổi

        // Kiểm tra đang ở chế độ tối hay sáng
        if (html.classList.contains("dark")) {
          // Đang tối -> chuyển sang sáng
          html.classList.remove("dark");
          themeToggle.innerHTML =
            '<i class="fas fa-moon text-gray-600 dark:text-gray-300"></i>';
          localStorage.setItem("theme", "light"); // Lưu vào bộ nhớ
        } else {
          // Đang sáng -> chuyển sang tối
          html.classList.add("dark");
          themeToggle.innerHTML =
            '<i class="fas fa-sun text-gray-600 dark:text-gray-300"></i>';
          localStorage.setItem("theme", "dark"); // Lưu vào bộ nhớ
        }
      }

      // ===== QUẢN LÝ FONT CHỮ =====
      // Khởi tạo font từ bộ nhớ trình duyệt
      function initFont() {
        const savedFont = localStorage.getItem("font") || "inter"; // Mặc định là Inter
        document.getElementById("fontSelector").value = savedFont; // Cập nhật dropdown
        applyFont(savedFont); // Áp dụng font
      }

      // Áp dụng font được chọn cho toàn bộ website
      function applyFont(fontFamily) {
        const body = document.getElementById("body");
        body.className = body.className.replace(/font-\w+/g, ""); // Xóa font cũ
        body.classList.add(`font-${fontFamily}`); // Thêm font mới
        localStorage.setItem("font", fontFamily); // Lưu vào bộ nhớ
      }

      // ===== CHỨC NĂNG TÌM KIẾM =====
      // Khởi tạo tính năng tìm kiếm blog
      function initSearch() {
        const searchInput = document.getElementById("searchInput");
        const searchResults = document.getElementById("searchResults");

        searchInput.addEventListener("input", function (e) {
          const query = e.target.value.toLowerCase().trim();

          if (query.length < 2) {
            searchResults.classList.add("hidden");
            return;
          }

          const filteredBlogs = blogs.filter(
            (blog) =>
              blog.title.toLowerCase().includes(query) ||
              blog.description.toLowerCase().includes(query)
          );

          if (filteredBlogs.length > 0) {
            searchResults.innerHTML = filteredBlogs
              .map(
                (blog) => `
                              <div class="p-3 hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer border-b border-gray-100 dark:border-gray-600 last:border-b-0" onclick="showBlogDetail(${
                                blog.id
                              })">
                                  <h4 class="font-medium text-sm">${
                                    blog.title
                                  }</h4>
                                  <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">${blog.description.substring(
                                    0,
                                    80
                                  )}...</p>
                              </div>
                          `
              )
              .join("");
            searchResults.classList.remove("hidden");
          } else {
            searchResults.innerHTML =
              '<div class="p-3 text-sm text-gray-500 dark:text-gray-400">Không tìm thấy kết quả</div>';
            searchResults.classList.remove("hidden");
          }
        });

        // Hide search results when clicking outside
        document.addEventListener("click", function (e) {
          if (
            !searchInput.contains(e.target) &&
            !searchResults.contains(e.target)
          ) {
            searchResults.classList.add("hidden");
          }
        });
      }

      // ===== CÁC HÀM ĐIỀU HƯỚNG TRANG =====
      // Hiển thị trang chủ (danh sách blog)
      function showHome() {
        hideAllPages(); // Ẩn tất cả trang khác
        document.getElementById("homePage").classList.remove("hidden"); // Hiện trang chủ
        renderBlogs(); // Vẽ lại danh sách blog
      }

      function showBlogDetail(blogId) {
        const blog = blogs.find((b) => b.id === blogId);
        if (!blog) return;

        currentBlogId = blogId;
        hideAllPages();
        document.getElementById("blogDetailPage").classList.remove("hidden");

        document.getElementById("blogContent").innerHTML = `
                      <div class="mb-8">
                          <img src="${blog.image}" alt="${blog.title}" class="w-full h-64 object-cover rounded-lg mb-6">
                          <div class="flex items-center text-sm text-gray-500 dark:text-gray-400 mb-4">
                              <span>${blog.date}</span>
                              <span class="mx-2">•</span>
                              <span>${blog.readTime}</span>
                          </div>
                      </div>
                      <div class="blog-content-styling">
                          ${blog.content}
                      </div>
                  `;

        renderComments(blog.comments);
        updateBlogNavigation(blogId);

      function showAbout() {
        hideAllPages();
        document.getElementById("aboutPage").classList.remove("hidden");
        updateAboutPage();
      }

      // Hiển thị bài viết ngẫu nhiên
      function showRandomBlog() {
        if (blogs.length === 0) return;

        // Chọn ngẫu nhiên một blog (tránh blog hiện tại nếu đang xem blog)
        let availableBlogs = blogs;
        if (currentBlogId) {
          availableBlogs = blogs.filter((blog) => blog.id !== currentBlogId);
        }

        if (availableBlogs.length === 0) {
          availableBlogs = blogs; // Fallback nếu chỉ có 1 blog
        }

        const randomIndex = Math.floor(Math.random() * availableBlogs.length);
        const randomBlog = availableBlogs[randomIndex];

        showBlogDetail(randomBlog.id);
      }

      function hideAllPages() {
        const pages = ["homePage", "blogDetailPage", "aboutPage"];
        pages.forEach((pageId) => {
          document.getElementById(pageId).classList.add("hidden");
        });
      }

      // Render Functions
      function renderBlogs() {
        const startIndex = (currentPage - 1) * blogsPerPage;
        const endIndex = startIndex + blogsPerPage;
        const paginatedBlogs = blogs.slice(startIndex, endIndex);

        const blogList = document.getElementById("blogList");

        if (paginatedBlogs.length === 0) {
          blogList.innerHTML =
            '<p class="text-center text-gray-500 dark:text-gray-400 py-8">Không có bài viết nào.</p>';
          return;
        }

        let blogHTML = "";

        // Featured post (latest/first post)
        if (currentPage === 1 && paginatedBlogs.length > 0) {
          const featuredBlog = paginatedBlogs[0];
          blogHTML += `
                          <article class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden hover:shadow-lg transition-all duration-300 cursor-pointer mb-8" onclick="showBlogDetail(${featuredBlog.id})">
                              <img src="${featuredBlog.image}" alt="${featuredBlog.title}" class="w-full h-64 object-cover">
                              <div class="p-8">
                                  <div class="flex items-center mb-4">

                                  <p class="text-gray-600 dark:text-gray-400 mb-6 leading-relaxed text-lg">${featuredBlog.description}</p>
                                  <div class="flex justify-between items-center text-sm text-gray-500 dark:text-gray-400">
                                      <div class="flex items-center space-x-4">
                                          <span>${featuredBlog.date}</span>
                                          <span>${featuredBlog.readTime}</span>
                                      </div>
                                      <span class="text-accent hover:text-accent-dark font-medium text-lg">Đọc thêm →</span>
                                  </div>
                              </div>
                          </article>
                      `;
        }

        // Other posts in 2-column grid
        const otherBlogs =
          currentPage === 1 ? paginatedBlogs.slice(1) : paginatedBlogs;

        if (otherBlogs.length > 0) {
          blogHTML += `
                          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                              ${otherBlogs
                                .map(
                                  (blog) => `
                                  <article class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden hover:shadow-lg transition-all duration-300 cursor-pointer transform hover:scale-105" onclick="showBlogDetail(${blog.id})">
                                      <img src="${blog.image}" alt="${blog.title}" class="w-full h-40 object-cover">
                                      <div class="p-4">
                                          <h3 class="text-lg font-semibold mb-2 hover:text-accent transition-colors line-clamp-2">${blog.title}</h3>
                                          <p class="text-gray-600 dark:text-gray-400 mb-3 leading-relaxed text-sm line-clamp-3">${blog.description}</p>
                                          <div class="flex justify-between items-center text-xs text-gray-500 dark:text-gray-400">
                                              <div class="flex items-center space-x-2">
                                                  <span>${blog.date}</span>
                                                  <span>•</span>
                                                  <span>${blog.readTime}</span>
                                              </div>
                                              <span class="text-accent hover:text-accent-dark font-medium">Đọc →</span>
                                          </div>
                                      </div>
                                  </article>
                              `
                                )
                                .join("")}
                          </div>
                      `;
        }

        blogList.innerHTML = blogHTML;
        renderPagination();
      }

      function renderPagination() {
        const totalPages = Math.ceil(blogs.length / blogsPerPage);
        const pagination = document.getElementById("pagination");

        if (totalPages <= 1) {
          pagination.innerHTML = "";
          return;
        }

        let paginationHTML = "";

        // Previous button
        if (currentPage > 1) {
          paginationHTML += `<button onclick="changePage(${
            currentPage - 1
          })" class="px-3 py-2 text-sm bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700">Trước</button>`;
        }

        // Page numbers
        for (let i = 1; i <= totalPages; i++) {
          const isActive = i === currentPage;
          paginationHTML += `<button onclick="changePage(${i})" class="px-3 py-2 text-sm ${
            isActive
              ? "bg-accent text-white"
              : "bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700"
          } rounded-lg">${i}</button>`;
        }

        // Next button
        if (currentPage < totalPages) {
          paginationHTML += `<button onclick="changePage(${
            currentPage + 1
          })" class="px-3 py-2 text-sm bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700">Sau</button>`;
        }

        pagination.innerHTML = paginationHTML;
      }

      function changePage(page) {
        currentPage = page;
        renderBlogs();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function renderComments(comments) {
        const commentsList = document.getElementById("commentsList");

        if (comments.length === 0) {
          commentsList.innerHTML =
            '<p class="text-gray-500 dark:text-gray-400 text-center py-8">Chưa có bình luận nào. Hãy là người đầu tiên!</p>';
          return;
        }

        commentsList.innerHTML = comments
          .map(
            (comment) => `
                      <div class="bg-gray-50 dark:bg-gray-800 rounded-lg p-4 ${
                        comment.pinned ? "border-l-4 border-accent" : ""
                      }">
                          <div class="flex items-start space-x-3">
                              <div class="w-10 h-10 bg-accent rounded-full flex items-center justify-center text-white font-semibold">

                                  <div class="flex items-center space-x-2 mb-2">
                                      <h4 class="font-semibold">${

                                  }</p>

                      </div>

          .join("");

      function updateAboutPage() {
        document.getElementById("aboutProfileImg").src = profile.image;
        document.getElementById("aboutProfileName").textContent = profile.name;
        document.getElementById("aboutProfileBio").textContent = profile.bio;
      }

      function updateProfile() {
        document.getElementById("profileImg").src = profile.image;
        document.getElementById("profileName").textContent = profile.name;
        document.getElementById("profileBio").textContent = profile.bio;
        renderSocialLinks();
      }

      // ===== HÀM QUẢN LÝ ICON VÀ TÊN MẠNG XÃ HỘI =====
      function getSocialConfig() {
        return {
          icons: {
            facebook: "fab fa-facebook",
            instagram: "fab fa-instagram",
            youtube: "fab fa-youtube",
            website: "fas fa-globe",
            email: "fas fa-envelope",
          },
          names: {
            facebook: "Facebook",
            instagram: "Instagram",
            youtube: "YouTube",
            website: "Website",
            email: "Email",
          },
        };
      }

      function renderSocialLinks() {
        const { icons: socialIcons, names: socialNames } = getSocialConfig();

        // Render sidebar social links (compact)
        const sidebarLinks = Object.entries(profile.socialLinks)
          .filter(([key, url]) => url && url.trim())
          .map(([key, url]) => {
            const href = key === "email" ? `mailto:${url}` : url;
            return `<a href="${href}" target="_blank" class="text-gray-500 hover:text-accent transition-colors" title="${socialNames[key]}">
                              <i class="${socialIcons[key]}"></i>
                          </a>`;
          })
          .join("");
        document.getElementById("sidebarSocialLinks").innerHTML = sidebarLinks;

        // Render header social links (compact)
        const headerLinks = Object.entries(profile.socialLinks)
          .filter(([key, url]) => url && url.trim())
          .slice(0, 3) // Limit to 3 for header
          .map(([key, url]) => {
            const href = key === "email" ? `mailto:${url}` : url;
            return `<a href="${href}" target="_blank" class="text-gray-500 hover:text-accent transition-colors" title="${socialNames[key]}">
                              <i class="${socialIcons[key]}"></i>
                          </a>`;
          })
          .join("");
        document.getElementById("headerSocialLinks").innerHTML = headerLinks;

        // Render about page social links (with labels)
        const aboutLinks = Object.entries(profile.socialLinks)
          .filter(([key, url]) => url && url.trim())
          .map(([key, url]) => {
            const href = key === "email" ? `mailto:${url}` : url;
            return `<a href="${href}" target="_blank" class="flex items-center space-x-2 text-gray-600 dark:text-gray-400 hover:text-accent transition-colors">
                              <i class="${socialIcons[key]} text-xl"></i>
                              <span>${socialNames[key]}</span>
                          </a>`;
          })
          .join("");
        document.getElementById("aboutSocialLinks").innerHTML = aboutLinks;
      }

      function updateBlogNavigation(currentBlogId) {
        const currentIndex = blogs.findIndex((b) => b.id === currentBlogId);
        const prevBtn = document.getElementById("prevBlog");
        const nextBtn = document.getElementById("nextBlog");

        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === blogs.length - 1;

        if (!prevBtn.disabled) {
          prevBtn.onclick = () => showBlogDetail(blogs[currentIndex - 1].id);
        }
        if (!nextBtn.disabled) {
          nextBtn.onclick = () => showBlogDetail(blogs[currentIndex + 1].id);
        }
      }

      // Event Listeners
      document
        .getElementById("themeToggle")
        .addEventListener("click", toggleTheme);
      document
        .getElementById("fontSelector")
        .addEventListener("change", function (e) {
          applyFont(e.target.value);
        });

      document
        .getElementById("commentForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const name = document.getElementById("commentName").value;
          const content = document.getElementById("commentContent").value;

          const blog = blogs.find((b) => b.id === currentBlogId);
          const newComment = {
            id: blog.comments.length + 1,
            name: name,
            content: content,
            date: new Date().toLocaleDateString("vi-VN", {
              day: "numeric",
              month: "long",
              year: "numeric",
            }),
            pinned: false,
          };

          blog.comments.push(newComment);
          renderComments(blog.comments);

          // Reset form
          document.getElementById("commentForm").reset();
